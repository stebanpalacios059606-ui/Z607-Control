name: Prueba de descarga APK
on:
  push:
    branches:
      - v3.0-bluetooth-volumen-extra
    paths:
      - '.github/workflows/prueba-descarga.yml'
      - 'app/src/main/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Z607-Control-Prueba.apk
      - name: Subir artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Z607-Control-Prueba
          path: Z607-Control-Prueba.apk
      - name: Publicar descarga directa de prueba
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-descarga
          name: Z607 Control - Prueba de descarga
          body: Archivo APK de prueba con nombre alternativo.
          files: Z607-Control-Prueba.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
